name: GHDL CI

on:
  push:

jobs:
  ghdl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ghdl/setup-ghdl@v1
        with:
          version: 5.1.1
          backend: mcode
      - name: Analyze
        run: |
          ghdl -a --std=08 \
            src/mc68881_pkg.vhd \
            src/mc68881_fp80_mul_unit.vhd \
            src/mc68881_fp80_addsub_unit.vhd \
            src/mc68881_modrem_post_unit.vhd \
            src/mc68881_divrem_unit.vhd \
            src/mc68881_trig_unit.vhd \
            src/mc68881_sgl_ops_unit.vhd \
            src/mc68881_alu.vhd \
            src/mc68881_packed_decimal_unit.vhd \
            src/mc68881_top.vhd \
            wrappers/mc68881_bus_bridge.vhd \
            wrappers/mc68881_axilite_wrapper.vhd \
            wrappers/mc68881_wishbone_wrapper.vhd \
            tb/mc68881_golden_vectors_pkg.vhd \
            tb/tb_mc68881_alu.vhd \
            tb/tb_mc68881_alu_lite.vhd \
            tb/tb_mc68881_addsub_denormal.vhd \
            tb/tb_mc68881_denormal_rounding.vhd \
            tb/tb_mc68881_known_defects.vhd \
            tb/tb_mc68881_top.vhd \
            tb/tb_mc68881_ea_cycles.vhd \
            tb/tb_mc68881_cycle_counts.vhd \
            tb/tb_mc68881_cir_dialog.vhd \
            tb/tb_mc68881_cir_interrupt.vhd \
            tb/tb_mc68881_torture.vhd \
            tb/tb_mc68881_packed_lite.vhd \
            tb/tb_mc68881_cir_datasheet_map.vhd \
            tb/tb_mc68881_axilite.vhd \
            tb/tb_mc68881_wishbone.vhd \
            tb/tb_mc68881_timeout.vhd \
            tb/tb_mc68881_wrapper_datasheet.vhd
      - name: Run tb_mc68881_alu
        run: |
          ghdl -e --std=08 tb_mc68881_alu
          ghdl -r --std=08 tb_mc68881_alu --assert-level=error
      - name: Run tb_mc68881_top
        run: |
          ghdl -e --std=08 tb_mc68881_top
          ghdl -r --std=08 tb_mc68881_top --assert-level=error
      - name: Run tb_mc68881_ea_cycles
        run: |
          ghdl -e --std=08 tb_mc68881_ea_cycles
          ghdl -r --std=08 tb_mc68881_ea_cycles --assert-level=error
      - name: Run tb_mc68881_cycle_counts
        run: |
          ghdl -e --std=08 tb_mc68881_cycle_counts
          ghdl -r --std=08 tb_mc68881_cycle_counts --assert-level=error
      - name: Run tb_mc68881_alu_lite
        run: |
          ghdl -e --std=08 tb_mc68881_alu_lite
          ghdl -r --std=08 tb_mc68881_alu_lite --assert-level=error
      - name: Run tb_mc68881_addsub_denormal
        run: |
          ghdl -e --std=08 tb_mc68881_addsub_denormal
          ghdl -r --std=08 tb_mc68881_addsub_denormal --assert-level=error
      - name: Run tb_mc68881_denormal_rounding
        run: |
          ghdl -e --std=08 tb_mc68881_denormal_rounding
          ghdl -r --std=08 tb_mc68881_denormal_rounding --assert-level=error
      - name: Run tb_mc68881_cir_dialog
        run: |
          ghdl -e --std=08 tb_mc68881_cir_dialog
          ghdl -r --std=08 tb_mc68881_cir_dialog --assert-level=error
      - name: Run tb_mc68881_cir_interrupt
        run: |
          ghdl -e --std=08 tb_mc68881_cir_interrupt
          ghdl -r --std=08 tb_mc68881_cir_interrupt --assert-level=error
      - name: Run tb_mc68881_torture
        run: |
          ghdl -e --std=08 tb_mc68881_torture
          ghdl -r --std=08 tb_mc68881_torture --assert-level=error
      - name: Run tb_mc68881_packed_lite
        run: |
          ghdl -e --std=08 tb_mc68881_packed_lite
          ghdl -r --std=08 tb_mc68881_packed_lite --assert-level=error
      - name: Run tb_mc68881_cir_datasheet_map
        run: |
          ghdl -e --std=08 tb_mc68881_cir_datasheet_map
          ghdl -r --std=08 tb_mc68881_cir_datasheet_map --assert-level=error
      - name: Run tb_mc68881_axilite
        run: |
          ghdl -e --std=08 tb_mc68881_axilite
          ghdl -r --std=08 tb_mc68881_axilite --assert-level=error
      - name: Run tb_mc68881_wishbone
        run: |
          ghdl -e --std=08 tb_mc68881_wishbone
          ghdl -r --std=08 tb_mc68881_wishbone --assert-level=error
      - name: Run tb_mc68881_timeout
        run: |
          ghdl -e --std=08 tb_mc68881_timeout
          ghdl -r --std=08 tb_mc68881_timeout --assert-level=error
      - name: Run tb_mc68881_wrapper_datasheet
        run: |
          ghdl -e --std=08 tb_mc68881_wrapper_datasheet
          ghdl -r --std=08 tb_mc68881_wrapper_datasheet --assert-level=error
