name: GHDL CI

on:
  push:

jobs:
  ghdl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ghdl/setup-ghdl@v1
        with:
          version: 5.1.1
          backend: mcode
      - name: Analyze
        run: |
          ghdl -a --std=08 \
            src/mc68881_pkg.vhd \
            src/mc68881_modrem_post_unit.vhd \
            src/mc68881_divrem_unit.vhd \
            src/mc68881_trig_unit.vhd \
            src/mc68881_sgl_ops_unit.vhd \
            src/mc68881_alu.vhd \
            src/mc68881_top.vhd \
            tb/mc68881_golden_vectors_pkg.vhd \
            tb/tb_mc68881_alu.vhd \
            tb/tb_mc68881_top.vhd \
            tb/tb_mc68881_ea_cycles.vhd \
            tb/tb_mc68881_cycle_counts.vhd
      - name: Run tb_mc68881_alu
        run: |
          ghdl -e --std=08 tb_mc68881_alu
          ghdl -r --std=08 tb_mc68881_alu --assert-level=error
      - name: Run tb_mc68881_top
        run: |
          ghdl -e --std=08 tb_mc68881_top
          ghdl -r --std=08 tb_mc68881_top --assert-level=error
      - name: Run tb_mc68881_ea_cycles
        run: |
          ghdl -e --std=08 tb_mc68881_ea_cycles
          ghdl -r --std=08 tb_mc68881_ea_cycles --assert-level=error
      - name: Run tb_mc68881_cycle_counts
        run: |
          ghdl -e --std=08 tb_mc68881_cycle_counts
          ghdl -r --std=08 tb_mc68881_cycle_counts --assert-level=error
